openapi: 3.1.0
info:
  title: Orders API
  version: 3.2.0
  description: Place, amend, and cancel orders. The most-consumed interface at Northwind.
servers:
  - url: https://ordering.northwind.example/v3
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
    post:
      operationId: placeOrder
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '201':
          description: The order as accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { description: The idempotency key has already been used with a different body. }
  /orders/{orderId}:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOrder
      responses:
        '200':
          description: One order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { description: No such order. }
  /orders/{orderId}/cancellation:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: cancelOrder
      summary: Cancel an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/CancellationReason' }
      responses:
        '204': { description: Cancelled. }
        '409': { description: The order has already shipped and cannot be cancelled. }
components:
  schemas:
    OrderStatus:
      type: string
      enum: [pending, confirmed, shipped, delivered, cancelled]
    Order:
      type: object
      required: [id, customerId, status, lines, placedAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        notes:
          type: string
          deprecated: true
          description: >-
            Free-text note. Deprecated in 3.2.0 - unstructured and never machine-read.
            Use cancellationReason for the one case that had a meaning.
        cancellationReason:
          $ref: '#/components/schemas/CancellationReason'
        placedAt: { type: string, format: date-time }
    CancellationReason:
      type: string
      description: Added in 3.2.0. Closed set, so cancellations can be counted by cause.
      enum: [customer-request, payment-failed, out-of-stock, fraud-suspected, duplicate]
    OrderLine:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money' }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, description: Decimal as a string, so no client rounds it. }
        currency: { type: string, minLength: 3, maxLength: 3 }
    PlaceOrderRequest:
      type: object
      required: [customerId, lines]
      properties:
        customerId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderLine' }
        notes: { type: string }
