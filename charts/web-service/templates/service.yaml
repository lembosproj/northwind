{{- if .Values.ports }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "webservice.fullname" . }}
  labels: {{- include "webservice.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "webservice.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      protocol: TCP
    {{- end }}
{{- end }}
