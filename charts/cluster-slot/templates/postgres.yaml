# One PostgreSQL cluster per slot. Its name is a value rather than fixed, because the blueprint publishes it: a
# database resource reads where to go from the environment instead of assuming it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.name }}
  labels:
    {{- include "slot.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.imageName }}
  storage:
    size: {{ .Values.postgres.storage }}
  # The owner every database a resource adds is created for. CloudNativePG writes its credentials to <name>-app.
  bootstrap:
    initdb:
      database: app
      owner: app
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
