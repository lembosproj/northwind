# One PostgreSQL cluster per slot, named the same in every slot: a database resource is created in "postgres" of the
# namespace it lands in, so its chart never has to be told which cluster that is.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  labels:
    {{- include "slot.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.imageName }}
  storage:
    size: {{ .Values.postgres.storage }}
  # The owner every database a resource adds is created for. CloudNativePG writes its credentials to postgres-app.
  bootstrap:
    initdb:
      database: app
      owner: app
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
