apiVersion: v1
kind: ResourceQuota
metadata:
  name: slot
  labels:
    {{- include "slot.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.cpu | quote }}
    requests.memory: {{ .Values.quota.memory | quote }}
    pods: {{ .Values.quota.pods | quote }}
---
# A quota on requests refuses a pod that states none, so every container gets one by default — a chart that forgot
# its requests still starts here, and is counted against the slot like everything else.
apiVersion: v1
kind: LimitRange
metadata:
  name: slot
  labels:
    {{- include "slot.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {memory: 512Mi}
