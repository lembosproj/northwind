{{- if include "slot.restricted" . }}
# Ingress from the slot itself, from the cluster's ingress controller, and from the CloudNativePG operator, which
# manages its instances over their own port. Egress is not restricted: a workload reaches managed services and
# third-party APIs by address, and naming them here would be a second copy of every binding in the catalog.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slot
  labels:
    {{- include "slot.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
{{- end }}
