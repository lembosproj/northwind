{{- /*
  Copies each binding's secret from the slot's Key Vault into the Secret its URL is read from (see the dependency
  environment in _helpers.tpl), signed in as the slot identity. Only where the slot gives both: the AKS Key Vault
  provider copies a secret only while a pod mounts it, so the deployment mounts this too.
*/}}
{{- if include "service.keyVaultSecrets" . }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "service.fullname" . }}
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.identity.azure.clientId | quote }}
    keyvaultName: {{ .Values.identity.azure.keyVault | quote }}
    tenantId: {{ .Values.identity.azure.tenantId | quote }}
    objects: |
      array:
      {{- range $handle, $binding := .Values.resourceBindings }}
      {{- with $binding.secretRef }}
        - |
          objectName: {{ . | replace "/" "-" | lower }}
          objectType: secret
      {{- end }}
      {{- end }}
  secretObjects:
    {{- range $handle, $binding := .Values.resourceBindings }}
    {{- with $binding.secretRef }}
    - secretName: {{ . | replace "/" "-" | lower | trunc 253 }}
      type: Opaque
      data:
        - objectName: {{ . | replace "/" "-" | lower }}
          key: url
    {{- end }}
    {{- end }}
{{- end }}
