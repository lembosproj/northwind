apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.fullname" . }}
  labels: {{- include "worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worker.labels" . | nindent 8 }}
        {{- if .Values.identity.azure.clientId }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with include "worker.serviceAccountName" . }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- if include "worker.keyVaultSecrets" . }}
      volumes:
        - name: key-vault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "worker.fullname" . }}
      {{- end }}
      {{- /* A consumer killed mid-message redelivers it; the grace period is what avoids that. */}}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: app
          image: {{ include "worker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.ports }}
          ports:
            {{- range . }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
          {{- end }}
          env:
            - name: LEMBOS_COMPONENT
              value: {{ .Values.lembos.component | quote }}
            - name: LEMBOS_ENVIRONMENT
              value: {{ .Values.lembos.environment | quote }}
            - name: LEMBOS_SLOT
              value: {{ .Values.lembos.slot | quote }}
            {{- if include "worker.keyVaultSecrets" . }}
            {{- /* Where the bindings' URLs are read from when the copied Secret is not there yet (Northwind.Runtime). */}}
            - name: SECRETS_DIRECTORY
              value: /mnt/key-vault
            {{- end }}
            {{- range $key, $value := .Values.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- include "worker.dependencyEnv" . | trim | nindent 12 }}
          resources: {{- include "worker.resources" . | nindent 12 }}
          {{- if include "worker.keyVaultSecrets" . }}
          volumeMounts:
            - name: key-vault
              mountPath: /mnt/key-vault
              readOnly: true
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
