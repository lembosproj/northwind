# Same values contract as service: Lembos renders it from a ComponentSpecVersion and does
# not know which chart it is feeding. What differs is what the chart does with it — a worker takes
# no ingress and its ports, if any, are for metrics rather than traffic.

lembos:
  component: ""
  environment: ""
  slot: ""

image:
  # No archetype is published under its own name: each component's repository holds its archetype's build, and
  # the platform sets which. This default is one that exists, so a standalone render pulls.
  repository: ghcr.io/lembosproj/northwind/apps/order-event-publisher
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

replicas: 1

# A worker declaring a public port is a spec error rather than something to render, so isPublic is
# ignored here. Ports are still honoured for metrics scraping.
ports: []

# One entry per resource the component depends on, keyed by a handle: where it is, and where its credential lives —
# never the credential. Rendered as <HANDLE>_ENDPOINT (host:port, where a bare host comes with a port, as the
# resource modules publish them apart), <HANDLE>_PORT and <HANDLE>_SECRET_REF, plus <HANDLE>_URL from a Kubernetes
# secret named after the path, where a provisioner placed one.
resourceBindings: {}
#  ordersDb:
#    endpoint: northwind-sandbox-default-ordering-orders-db.local
#    port: 5432
#    secretRef: northwind/sandbox/default/ordering/orders-db

# One entry per component this one calls, keyed by a name: its host, or a whole URL. Rendered as UPSTREAM_<NAME>; a
# host is called over HTTP on port 80, which every service answers callers on.
upstreams: {}
#  orderApi: ordering-order-api-default.northwind-sandbox-default.svc.cluster.local

# The spec's settings, projected as environment variables.
config: {}
sizeClass: small

sizes:
  small:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  medium:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: "2",  memory: 2Gi }
  large:
    requests: { cpu: "2",  memory: 2Gi }
    limits:   { cpu: "4",  memory: 8Gi }

# Scale to zero is the point of this blueprint: a consumer with an empty queue should cost nothing.
autoscaling:
  enabled: false
  minReplicas: 0
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

# How long the process is given to finish the message in flight before it is killed.
terminationGracePeriodSeconds: 60

serviceAccount:
  create: true
  annotations: {}

# Who the pods sign in as, where the slot gives them an identity. Empty, the chart makes a service account of its own
# and the pods sign in as nothing, which is every slot on a cluster with no cloud identity behind it.
identity:
  # A service account the slot made, to run as in place of the chart's own: the namespace module's `workload`.
  serviceAccount: ""
  azure:
    # The slot identity's client id. Set, the pods sign in through Azure workload identity, as that identity.
    clientId: ""
    tenantId: ""
    # The vault the slot's resources keep their secrets in. Set with clientId, each binding's secret is copied from it
    # into the Secret its URL is read from, by the AKS Key Vault provider signed in as the slot identity.
    keyVault: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
