name: apps

# A version tag publishes `{version}` and `sha-{commit}`; a push that changes an app, on any branch, publishes
# `sha-{commit}` alone — what a team's pipeline does on every push, and what the platform registers as a build.
#
# Not on pushes that leave the apps alone: the working loop for this fixture is `aspire run` against a local
# registry, where an image is built and pulled without leaving the machine. Publishing here covers what that loop
# does not — somebody running the fixture without building it, and provenance and digest pinning across a real
# network boundary, from the push to the component's Artifacts tab.
on:
  push:
    tags: ['apps/v*']
    branches: ['**']
    paths: ['apps/**', '.github/workflows/apps.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # One build per archetype, pushed straight into the repository of every component it serves. A platform records
  # an artifact as its bytes in one repository, so two components cannot both claim one image — each gets the same
  # bytes under its own name. One push of one build to several repositories is one index, so the digest is identical
  # in each and what a component runs is provably what its archetype built. Nothing is published under the
  # archetype's own name, because nothing deploys it.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: Northwind.WebService
            components: order-api checkout-bff cart-service
          - project: Northwind.Worker
            components: order-event-publisher
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: repositories
        env:
          COMPONENTS: ${{ matrix.components }}
        run: |
          {
            echo 'list<<EOF'
            for component in $COMPONENTS; do echo "$REGISTRY/$GITHUB_REPOSITORY/apps/$component"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repositories.outputs.list }}
          tags: |
            type=match,pattern=apps/v(.*),group=1
            type=sha,format=long

      # The digest is the point of this step. A component's build pins a digest, and a deployment
      # records the one it resolved — so the digest this emits is what makes the seeded artifact
      # coordinates resolvable instead of synthesised.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: apps
          file: apps/src/${{ matrix.project }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.project }}
          cache-to: type=gha,mode=max,scope=${{ matrix.project }}

      - name: Report digest
        env:
          COMPONENTS: ${{ matrix.components }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for component in $COMPONENTS; do
            echo "apps/$component -> $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          done

  # Each component's build registered with the platform, as the component's artifact: one leg per component, because
  # an artifact belongs to one component and the action registers one. The digest is read back from the registry
  # rather than handed over from the build legs — a matrix job's outputs are not per leg — and the registry is the
  # record the platform reads anyway.
  #
  # Skipped where no platform is configured (the variables below), so a fork builds and pushes without one. The
  # service account, its owning group and its role are described in the README, under Publishing.
  register:
    needs: images
    if: vars.LEMBOS_ORCHESTRATOR_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component:
          - ordering/order-api
          - ordering/order-event-publisher
          - checkout/checkout-bff
          - checkout/cart-service
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag the build legs pushed for this commit, and the label the platform shows: the version on a version
      # tag, `sha-{commit}` otherwise.
      - id: pushed
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          repository="$REGISTRY/$GITHUB_REPOSITORY/apps/${COMPONENT#*/}"
          digest="$(docker buildx imagetools inspect "$repository:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$GITHUB_REF" in
            refs/tags/apps/v*) tag="${GITHUB_REF#refs/tags/apps/v}" ;;
            *) tag="sha-$GITHUB_SHA" ;;
          esac
          {
            echo "repository=$repository"
            echo "digest=$digest"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - id: publish
        uses: lembosproj/platform/src/Integrations/GitHub/publish-artifact@v0.3.0
        with:
          client-id: ${{ secrets.LEMBOS_CLIENT_ID }}
          private-key: ${{ secrets.LEMBOS_PRIVATE_KEY }}
          identity-url: ${{ vars.LEMBOS_IDENTITY_URL }}
          orchestrator-url: ${{ vars.LEMBOS_ORCHESTRATOR_URL }}
          component: ${{ matrix.component }}
          repository: ${{ steps.pushed.outputs.repository }}
          digest: ${{ steps.pushed.outputs.digest }}
          tag: ${{ steps.pushed.outputs.tag }}

      - name: Report artifact
        env:
          COMPONENT: ${{ matrix.component }}
          COORDINATE: ${{ steps.publish.outputs.coordinate }}
        run: echo "$COMPONENT registered $COORDINATE" >> "$GITHUB_STEP_SUMMARY"
